name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run API and UI scenarios
        env:
          HEADLESS: "true"
        run: mvn -B test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

  report:
    needs: tests
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Get report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # История трендов переносится из прошлого отчёта, затем отчёт собирается Allure CLI
      - name: Build Allure report
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/history; fi
          npx --yes allure-commandline@2.46.1 generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
