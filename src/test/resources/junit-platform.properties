cucumber.plugin=pretty,   json:target/cucumber.json,   rerun:target/rerun.txt,   io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.publish.quiet=true
cucumber.publish.enabled=false
# Параллельный запуск сценариев. AutoTestContext хранит данные сценария в ThreadLocal,
# поэтому сценарии изолированы друг от друга.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4
