#######################################
# Сотрудники. Группа (ключ) — команда; startData.keys фильтрует группы по префиксу.
# Сотрудник ищется по логину: найден — обновляется, не найден — создаётся вместе с учётной записью.
# Маска телефона-логина: 99999CCNNN, где CC — номер команды, NNN — порядковый номер.
#
# - info:                  карточка (login, name, surname, patronymic, birthday, phoneNumber)
#   password:              пароль; сбрасывается через SMS-код, если учётная запись требует смены
#   partyOrgExternalCode:  сотрудник организации (или partyPartnerCode — сотрудник партнёра)
#   roles, creationChannel: роли и канал в сервисе авторизации
#   accreditations:        код партнёра → код сотрудника у партнёра
#   linkSeller:            организации, где сотрудник оформляет продажи
#   linkManager:           организации, за которые сотрудник отвечает как менеджер
#######################################
employees:
  TEAM01:
    - info:
        login: '9999901001'
        phoneNumber: '9999901001'
        name: Иван
        surname: Продавцов
