# Окружение: подставляется в ${inventoryName} в URL сервисов и БД
env.inventoryName=dev
env.apiTimeoutInSeconds=60
env.apiIntervalInSeconds=2
env.frontTimeoutInSeconds=15
env.frontFastTimeoutInSeconds=2
env.frontLongTimeoutInSeconds=60
env.logsLongTimeoutInSeconds=120
env.devToolsFastIntervalInMilliseconds=50
env.devToolsIntervalInMilliseconds=1000
env.devToolsTimeoutInSeconds=30
env.devToolsLongTimeoutInSeconds=160
env.windowResizeAttempts=3

# Стартовые данные (partners.yaml, organizations.yaml, employees.yaml):
# generate создаёт организации и сотрудников, generatePartners — справочник партнёров,
# keys фильтрует группы по префиксу ключа команды
startData.generate=false
startData.generatePartners=false
startData.keys=

# Spring
spring.main.web-application-type=none
spring.main.lazy-initialization=true
logging.level.io.qameta.allure=OFF

# WebDriver: local | testcontainers | remote
env.browserType=chrome
env.browserOptions=null
env.webDriverType=local
env.webDriverVideoRecording=NONE
env.webDriverVideoFormat=mp4
env.webDriverVideoDirectory=./target/video/

# Токен для запросов генерации стартовых данных: -Denv.startToken=... или переменная START_TOKEN
env.startToken=${START_TOKEN:}
