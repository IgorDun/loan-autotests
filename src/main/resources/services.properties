# Параметры по умолчанию для всех сервисов
api.defaultService.timeout=15000
api.defaultService.port=443
api.defaultService.headers.content-type=application/json;charset=utf-8

# Сервисы. В url поддерживается ${inventoryName} — подставляется env.inventoryName.
# Заголовки авторизации задавайте на уровне сервиса через переменные окружения:
# api.services[N].headers.authorization=Bearer ${SERVICE_TOKEN:}
api.services[0].name=settings
api.services[0].url=https://settings.${inventoryName}.example.com/api/v1/

api.services[1].name=wiremock
api.services[1].url=http://localhost:8080/__admin/mappings/
api.services[1].port=8080

# Открытые тренажёры для примеров
api.services[2].name=dummyjson
api.services[2].url=https://dummyjson.com/

api.services[3].name=saucedemo
api.services[3].url=https://www.saucedemo.com/
